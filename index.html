    <script id="sona-startup-geometry">
      (function(){
        // Use the same logical device canvas as the native launch PNG. Do not
        // recenter the logo when iOS changes its initial WebView viewport.
        var root=document.documentElement;
        if(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches){
          var portrait=window.innerWidth<=window.innerHeight;
          var short=Math.min(window.screen.width,window.screen.height),long=Math.max(window.screen.width,window.screen.height);
          root.style.setProperty('--sona-boot-width',(portrait?short:long)+'px');
          root.style.setProperty('--sona-boot-height',(portrait?long:short)+'px');
        }
      })();
    </script>
    <style id="sona-startup-critical">
      html,body{margin:0;width:100%;min-height:100%;background:#ff90a8}
      html.sona-booting,html.sona-booting body{
        background:linear-gradient(180deg,#ff90a8 0%,#ff4773 34%,#ff2750 66%,#ff022e 100%)!important;
      }
      #root{min-height:100%;background:#171719}
      #sona-startup{position:fixed;top:0;left:0;width:100vw;height:100vh;height:var(--sona-boot-height,100lvh);width:var(--sona-boot-width,100vw);z-index:2147483647;display:flex;align-items:center;justify-content:center;pointer-events:auto;overflow:hidden;isolation:isolate;opacity:1;transition:opacity .55s ease;background:linear-gradient(180deg,#ff90a8 0%,#ff4773 34%,#ff2750 66%,#ff022e 100%)}
      html.sona-booting,html.sona-booting body{overflow:hidden!important;padding:0!important;height:var(--sona-boot-height,100lvh)!important;}
      #sona-startup::before{display:none}
      #sona-startup.is-fading{opacity:0;pointer-events:none}
      #sona-startup .sona-startup-note{display:block;width:128px;height:128px;opacity:1;animation:none;flex:none;transform:none;filter:none}
      
      @media(prefers-reduced-motion:reduce){#sona-startup{transition-duration:.12s}#sona-startup .sona-startup-note{animation:none;opacity:1}}
    </style>

  <body>
    <div id="sona-startup" role="status" aria-label="Loading Sona">
      <svg class="sona-startup-note" width="128" height="128" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#ffffff" d="M201 166Q201 151 216 148L367 114Q383 110 383 126V329Q383 371 341 384Q297 398 283 372Q265 340 306 322Q324 315 346 314V205L241 228V375Q241 418 200 430Q155 445 141 416Q124 384 165 366Q183 358 201 357Z"/></svg>
    </div>
    <script>
      (function(){
        var cover=document.getElementById('sona-startup');
        var started=Date.now(), closing=false;
        function dismiss(){
          if(closing||!cover)return;
          closing=true;
          clearTimeout(watchdog);
          var delay=Math.max(0,650-(Date.now()-started));
          setTimeout(function(){
            var stable=0,previous='',waiting=Date.now();
            function settled(){
              var viewport=window.visualViewport;
              var geometry=window.innerHeight+':'+(viewport?viewport.height+':'+viewport.offsetTop:'');
              stable=geometry===previous?stable+1:0;previous=geometry;
              if(stable<3&&Date.now()-waiting<1200){requestAnimationFrame(settled);return;}
              requestAnimationFrame(function(){
              if(!cover)return;
              cover.classList.add('is-fading');
              cover.style.pointerEvents='none';
              setTimeout(function(){
                if(cover)cover.remove();
                document.documentElement.classList.remove('sona-booting');
              },600);
              });
            }
            requestAnimationFrame(settled);
          },delay);
        }
        document.addEventListener('sona:ready',function(){document.documentElement.dataset.sonaReady='true';dismiss()},{once:true});
        function resume(){
          if(!cover)return;
          clearTimeout(watchdog);
          cover.remove();cover=null;closing=true;
          document.documentElement.classList.remove('sona-booting');
        }
        window.addEventListener('pageshow',function(event){if(event.persisted)resume()});
        document.addEventListener('visibilitychange',function(){
          if(document.visibilityState==='visible' && document.documentElement.dataset.sonaReady==='true')resume();
        });
        // This is a visual boot cover, not a network-error screen.
        // Reveal the underlying React/router state if initialization stalls.
        var watchdog=setTimeout(dismiss,9000);
      })();
    </script>
