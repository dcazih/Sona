    <style>
      html,body{margin:0;width:100%;min-height:100%;background:#ff2859}
      #root{min-height:100%;background:#171719}
      #sona-startup{position:fixed;left:0;right:0;top:0;bottom:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:linear-gradient(155deg,#ff5477 0%,#ff2859 48%,#ff003c 100%);opacity:1;transition:opacity .42s ease;pointer-events:auto;transform:translateZ(0)}
      #sona-startup::before{content:"";position:absolute;inset:-100px 0 calc(-100px - env(safe-area-inset-bottom,0px));z-index:-1;background:inherit}
      #sona-startup.is-fading{opacity:0;pointer-events:none}
      #sona-startup .sona-startup-gif{display:block;width:92px;height:92px;object-fit:contain;filter:brightness(0) invert(1);animation:sona-icon-enter .3s ease-out both;transform-origin:center;backface-visibility:hidden}
      #sona-startup .sona-startup-fallback{display:none;font-size:82px;color:#fff;animation:sona-icon-enter .3s ease-out both}
      @keyframes sona-icon-enter{from{opacity:0}to{opacity:1}}
      @media(prefers-reduced-motion:reduce){#sona-startup{transition-duration:.12s}#sona-startup .sona-startup-gif,#sona-startup .sona-startup-fallback{animation:none}}
    </style>
  </head>

  <body>
    <div id="sona-startup" role="status" aria-label="Loading Sona">
      <div class="sona-startup-content" aria-hidden="true">
        <img class="sona-startup-logo" src="/apple-music-logo.png?v=12" width="118" height="118" alt=""
          onerror="this.onerror=null;this.src='/sona-brand.svg?v=12'">
        <img class="sona-startup-gif" src="/icons8-music.gif?v=12" width="34" height="34" alt=""
          onload="this.classList.add('is-loaded')" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="sona-startup-fallback" aria-hidden="true">♫</span>
      </div>
      <div class="sona-startup-error" role="alert">
        Sona couldn't finish starting. Check your connection and try again.
        <div><button class="sona-startup-retry" type="button" onclick="window.location.reload()">Retry</button></div>
      </div>
    </div>
    <script>
      // Boot guard lives in HTML; no bundle or router errors can leave an immortal overlay.
      (function(){
        var splash=document.getElementById('sona-startup');
        var started=Date.now(), minVisible=900, done=false, pending=false;
        var watchdog;
        function fade(){
          if(done || !splash)return;
          done=true;
          clearTimeout(watchdog);
          splash.classList.add('is-fading');
          splash.style.pointerEvents='none';
          setTimeout(function(){
            splash.remove();
            document.documentElement.classList.remove('sona-booting');
          },600);
        }
        function ready(){
          if(pending||done)return;
          pending=true;
          var wait=Math.max(0,minVisible-(Date.now()-started));
          setTimeout(function(){
            requestAnimationFrame(function(){requestAnimationFrame(fade)});
          },wait);
        }
        document.addEventListener('sona:ready',ready,{once:true});
        window.addEventListener('pageshow',function(event){if(event.persisted)ready()});
        watchdog=setTimeout(function(){
          if(done||pending)return;
          var app=document.querySelector('.sona-app-shell,.sona-login-screen');
          if(app){ready();return}
          splash.classList.add('has-error');
        },12000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
