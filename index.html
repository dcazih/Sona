<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <title>Sona · Your Music</title>
    <meta name="application-name" content="Sona">
    <meta name="apple-mobile-web-app-title" content="Sona">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    
    
    
    
    
    <meta name="msapplication-TileColor" content="#17171c">
    <meta name="theme-color" content="#080809">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="./env-config.js"></script>
  <link rel="icon" type="image/svg+xml" href="/sona-brand.svg?v=8">
    <link rel="apple-touch-icon" href="/sona-app-icon-180-v6.png">
    <link rel="manifest" href="/favicons/site.webmanifest?v=8">
    <style>
      html,body{margin:0;width:100%;min-height:100%;background:#ff2859}
      #root{min-height:100%;background:#171719}
      #sona-startup{position:fixed;left:0;right:0;top:0;bottom:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:linear-gradient(155deg,#ff5477 0%,#ff2859 48%,#ff003c 100%);opacity:1;transition:opacity .42s ease;pointer-events:auto;transform:translateZ(0)}
      #sona-startup::before{content:"";position:absolute;inset:-100px 0 calc(-100px - env(safe-area-inset-bottom,0px));z-index:-1;background:inherit}
      #sona-startup.is-fading{opacity:0;pointer-events:none}
      #sona-startup .sona-startup-gif{display:block;width:92px;height:92px;object-fit:contain;filter:brightness(0) invert(1);animation:sona-icon-enter .3s ease-out both;transform-origin:center;backface-visibility:hidden}
      #sona-startup .sona-startup-fallback{display:none;font-size:82px;color:#fff;animation:sona-icon-enter .3s ease-out both}
      @keyframes sona-icon-enter{from{opacity:0}to{opacity:1}}
      @media(prefers-reduced-motion:reduce){#sona-startup{transition-duration:.12s}#sona-startup .sona-startup-gif,#sona-startup .sona-startup-fallback{animation:none}}
    </style>
  </head>

  <body>
    <div id="sona-startup" role="status" aria-label="Loading Sona"><img class="sona-startup-gif" src="/icons8-music.gif" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="sona-startup-fallback" aria-hidden="true">♫</span></div>
    <script>
      // Runs independently of the app bundle, so a failed JS import cannot trap the user.
      (function(){
        var splash=document.getElementById('sona-startup');
        if(!splash)return;
        var finished=false;
        function dismiss(){
          if(finished)return;
          finished=true;
          splash.classList.add('is-fading');
          splash.style.pointerEvents='none';
          setTimeout(function(){splash.remove()},500);
        }
        window.__sonaDismissStartup=dismiss;
        var timer=setTimeout(dismiss,5500);
        var observer=new MutationObserver(function(){
          var root=document.getElementById('root');
          if(root&&root.children.length){
            observer.disconnect();
            clearTimeout(timer);
            setTimeout(dismiss,350);
          }
        });
        observer.observe(document.body,{childList:true,subtree:true});
        window.addEventListener('pageshow',function(e){if(e.persisted)dismiss()});
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
